<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ご登録ありがとうございます｜暮らしのお便り｜ドイツIOBオーガニックスクール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9f7ef;--surface:#fff;--ink:#553727;--ink-soft:#85634b;--ink-faint:#a68b73;--accent:#f26b3b;--border:rgba(85,55,39,.16)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:2;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.wrap{max-width:600px;margin:0 auto;padding:0 22px}
.site-head{padding:26px 0 0}
.site-head img{width:132px;margin:0 auto}
.main{padding:52px 0 20px;text-align:center}
h1{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:clamp(23px,5.6vw,30px);line-height:1.65;margin:0}
.body{margin:26px 0 0;text-align:left;font-size:15px}
.body p{margin:0 0 16px}
.notice{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin:28px 0 0;text-align:left;font-size:13.5px;color:var(--ink-soft);line-height:1.95}
footer{padding:48px 0 56px;text-align:center;font-size:11.5px;color:var(--ink-faint);line-height:2}
footer img{width:104px;margin:0 auto 18px;opacity:.9}
footer a{color:var(--ink-faint)}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap"><img src="../../germany-babyfood-note/images/logo_orange.png" alt="Institut für Organic Business"></div>
</header>
<div class="wrap">
  <div class="main">
    <h1>ご登録、<br>ありがとうございます</h1>
    <div class="body">
      <p>確認のメールをお送りしました。これから、ドイツのスーパーや日々の暮らしで見つけたことを、不定期にお届けします。</p>
      <p>配信はいつでも解除できます。</p>
    </div>
    <div class="notice">メールが見当たらないときは、迷惑メールフォルダやGmailの「プロモーション」タブをご確認ください。それでも届かない場合は、school@iob.bio までご連絡ください。</div>
  </div>
</div>
<footer>
  <div class="wrap">
    <img src="../../germany-babyfood-note/images/logo_orange.png" alt="Institut für Organic Business">
    <div>Institut für Organic Business GmbH<br>「オーガニックが、あたりまえ。」な社会へ</div>
    <div><a href="https://iobschool.github.io/iob-privacy/" target="_blank" rel="noopener">個人情報の取り扱いについて</a></div>
    <div id="cr"></div>
  </div>
</footer>
<script>
document.getElementById('cr').textContent =
  '© ' + new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric'}).format(new Date())
  + ' Institut für Organic Business GmbH. All Rights Reserved.';
</script>
</body>
</html>
